name: Issue Analysis with OpenAI

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

jobs:
  analyze-issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      ready-for-implementation: ${{ steps.implementation-readiness.outputs.ready }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read initial implementation readiness
        id: initial-readiness
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number
            });
            core.setOutput('ready', issue.labels.some(label => label.name === 'ready-for-implementation'));

      - name: Configure Codex GitHub API access
        env:
          CODEX_CI_HOME: ${{ runner.temp }}/codex-issue-analysis
        run: |
          mkdir -p "$CODEX_CI_HOME"
          cat > "$CODEX_CI_HOME/config.toml" <<'EOF'
          [features]
          network_proxy = true

          [permissions.issue-analysis]
          extends = ":workspace"

          [permissions.issue-analysis.network]
          enabled = true

          [permissions.issue-analysis.network.domains]
          "api.github.com" = "allow"
          EOF

      - name: Analyze Issue with OpenAI
        uses: openai/codex-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # Permit github-actions[bot] as the actor of repository automation.
          allow-bots: true
          codex-home: ${{ runner.temp }}/codex-issue-analysis
          permission-profile: issue-analysis
          model: 'gpt-5.6-luna'
          prompt: |
            /ci-re-review
                          
            REPOSITORY: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number || github.event.comment.issue_url }}

      # GITHUB_TOKEN label changes do not trigger another issues workflow.
      - name: Check whether analysis made the issue ready
        id: implementation-readiness
        if: steps.initial-readiness.outputs.ready != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number
            });
            core.setOutput('ready', issue.state === 'open' && !issue.pull_request &&
              issue.labels.some(label => label.name === 'ready-for-implementation'));

  implement-issue:
    needs: analyze-issue
    if: needs.analyze-issue.outputs.ready-for-implementation == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/issue-implementation.yml
    with:
      analysis-ready: true
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
