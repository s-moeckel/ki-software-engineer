services:
  backend:
    build: ./backend
    environment:
      DATABASE_FILE: /app/storage/bookmonkey.sqlite
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - '127.0.0.1:4730:4730'
    volumes:
      - bookmonkey-files:/app/storage
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4730/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s
    init: true
    restart: unless-stopped

  backend-test:
    profiles: ['test']
    build:
      context: ./backend
      target: test

volumes:
  bookmonkey-files:
