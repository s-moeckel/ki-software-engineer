<header class="bg-white dark:bg-gray-900 shadow">
  <div class="container mx-auto px-4 py-6 flex flex-wrap items-center justify-between gap-4">
    <h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400"><a routerLink="/">BookMonkey</a></h1>
    <div class="ml-auto flex max-w-full flex-wrap items-center justify-end gap-3">
      <nav aria-label="Hauptnavigation" class="flex max-w-full flex-wrap justify-end gap-2">
        <a
          routerLink="/library"
          routerLinkActive="active-view"
          [routerLinkActiveOptions]="activeLinkOptions"
          ariaCurrentWhenActive="page"
          aria-label="Virtual Library öffnen"
          title="Virtual Library öffnen"
          class="view-link inline-flex min-h-11 items-center gap-2 rounded-full border border-gray-300 px-3 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800"
        >
          <span aria-hidden="true">▤</span>
          <span>Library</span>
        </a>
        <a
          routerLink="/universe"
          routerLinkActive="active-view"
          [routerLinkActiveOptions]="activeLinkOptions"
          ariaCurrentWhenActive="page"
          aria-label="BookMonkey Universe öffnen"
          title="BookMonkey Universe öffnen"
          class="view-link inline-flex min-h-11 items-center gap-2 rounded-full border border-gray-300 px-3 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800"
        >
          <svg
            aria-hidden="true"
            class="size-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <circle cx="12" cy="12" r="6" />
            <ellipse cx="12" cy="12" rx="11" ry="3.5" transform="rotate(-30 12 12)" />
          </svg>
          <span>Universe</span>
        </a>
        <a
          routerLink="/"
          routerLinkActive="active-view"
          [routerLinkActiveOptions]="activeLinkOptions"
          ariaCurrentWhenActive="page"
          aria-label="Listenansicht öffnen"
          title="Listenansicht öffnen"
          class="view-link inline-flex min-h-11 items-center gap-2 rounded-full border border-gray-300 px-3 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-800"
        >
          <svg
            aria-hidden="true"
            class="size-6"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          >
            <path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1" />
          </svg>
          <span>Listenansicht</span>
        </a>
      </nav>
      <app-book-random-button />
      <button
        type="button"
        class="inline-flex size-11 items-center justify-center rounded-full border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 hover:bg-gray-100 dark:hover:bg-gray-800"
        [attr.aria-label]="themeLabel()"
        [title]="themeLabel()"
        (click)="cycleTheme()"
      >
        <svg
          aria-hidden="true"
          class="size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          @switch (theme.preference()) {
            @case ('system') {
              <rect x="3" y="4" width="18" height="13" rx="2" />
              <path d="M12 17v4m-4 0h8" />
            }
            @case ('light') {
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"
              />
            }
            @case ('dark') {
              <path d="M20.9 13.2A9 9 0 0 1 10.8 3.1a9 9 0 1 0 10.1 10.1Z" />
            }
          }
        </svg>
      </button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="bg-gray-100 dark:bg-gray-800 mt-12">
  <div class="container mx-auto px-4 py-6">
    <p class="text-center text-gray-600 dark:text-gray-300 text-sm">
      © 2023 BookMonkey App - Angular Workshop by workshops.de
    </p>
  </div>
</footer>
